<script>
(function () {
  var BASE = "https://guebin.github.io/BS2026-Play/repl/index.html";
  var btn = document.getElementById("replBtn");
  var box = document.getElementById("replBox");
  var frame = document.getElementById("replFrame");
  if (!btn || !box || !frame) return;

  // ★ 커널 이름은 대소문자를 가린다 — R 은 "webR" (실측 2026-09-08)
  var KERNEL = { R: "webR", python: "python" };
  var current = localStorage.getItem("bs2026-repl-kernel") || "R";

  function kernelParam(which) { return KERNEL[which] || KERNEL.R; }

  function load(which) {
    current = which;
    try { localStorage.setItem("bs2026-repl-kernel", which); } catch (e) {}
    var want = BASE + "?kernel=" + kernelParam(which) + "&toolbar=1";
    frame.setAttribute("src", want);
    box.querySelectorAll("[data-kernel]").forEach(function (b) {
      b.style.fontWeight = (b.dataset.kernel === which) ? "700" : "400";
    });
  }

  btn.addEventListener("click", function () {
    box.hidden = !box.hidden;                       // 접어도 iframe 은 살아 있다 (변수 유지)
    btn.textContent = box.hidden ? "▶ 실행창" : "▼ 실행창";
    if (!box.hidden && !frame.getAttribute("src")) load(current);
  });

  box.querySelectorAll("[data-kernel]").forEach(function (b) {
    b.addEventListener("click", function () { load(b.dataset.kernel); });
  });

  // ★ 왼쪽 위를 끌면 오른쪽·아래는 고정한 채 폭·높이가 는다
  (function () {
    var grip = document.getElementById("replGrip");
    var start = null;
    grip.addEventListener("pointerdown", function (e) {
      start = { x: e.clientX, y: e.clientY, w: box.offsetWidth, h: box.offsetHeight };
      grip.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    grip.addEventListener("pointermove", function (e) {
      if (!start) return;
      var w = start.w - (e.clientX - start.x);
      var h = start.h - (e.clientY - start.y);
      // ★ 위로는 네비바(상단 배너) 아래까지만 — 그 위로 올라가면 가려서 못 쓴다
      var nav = document.querySelector(".navbar, header#quarto-header, #quarto-header");
      var top = nav ? nav.getBoundingClientRect().bottom + 8 : 8;
      var maxH = window.innerHeight - top - 76;      // 76 = 아래 버튼 자리
      box.style.width  = Math.max(320, Math.min(w, window.innerWidth - 40)) + "px";
      box.style.height = Math.max(240, Math.min(h, maxH)) + "px";
    });
    function end(e) { if (start) { start = null; try { grip.releasePointerCapture(e.pointerId); } catch (_) {} } }
    grip.addEventListener("pointerup", end);
    grip.addEventListener("pointercancel", end);
  })();

  document.getElementById("replClose").addEventListener("click", function () {
    box.hidden = true; btn.textContent = "▶ 실행창";
  });

  document.getElementById("replLab").addEventListener("click", function () {
    // ★ 크기를 주면 브라우저가 «별도 창»으로 연다 (탭이 아니라)
    var w = Math.min(1200, Math.round(screen.availWidth  * 0.8));
    var h = Math.min(860,  Math.round(screen.availHeight * 0.85));
    var x = Math.round((screen.availWidth  - w) / 2);
    var y = Math.round((screen.availHeight - h) / 2);
    window.open(
      "https://guebin.github.io/BS2026-Play/lab/index.html",
      "bs2026lab",
      "popup=yes,width=" + w + ",height=" + h + ",left=" + x + ",top=" + y +
      ",noopener,resizable=yes,scrollbars=yes"
    );
  });
})();
</script>

              }
              gutterDiv.style.top = top - 2 + "px";
              gutterDiv.style.height = height + 4 + "px";
            }
            selectedAnnoteEl = annoteEl;
          }
        };
        const unselectCodeLines = () => {
          const elementsIds = ["code-annotation-line-highlight", "code-annotation-line-highlight-gutter"];
          elementsIds.forEach((elId) => {
            const div = window.document.getElementById(elId);
            if (div) {
              div.remove();
            }
          });
          selectedAnnoteEl = undefined;
        };
          // Handle positioning of the toggle
      window.addEventListener(
        "resize",
        throttle(() => {
          elRect = undefined;
          if (selectedAnnoteEl) {
            selectCodeLines(selectedAnnoteEl);
          }
        }, 10)
      );
      function throttle(fn, ms) {
      let throttle = false;
      let timer;
        return (...args) => {
          if(!throttle) { // first call gets through
              fn.apply(this, args);
              throttle = true;
          } else { // all the others get throttled
              if(timer) clearTimeout(timer); // cancel #2
              timer = setTimeout(() => {
                fn.apply(this, args);
                timer = throttle = false;
              }, ms);
          }
        };
      }
        // Attach click handler to the DT
        const annoteDls = window.document.querySelectorAll('dt[data-target-cell]');
        for (const annoteDlNode of annoteDls) {
          annoteDlNode.addEventListener('click', (event) => {
            const clickedEl = event.target;
            if (clickedEl !== selectedAnnoteEl) {
              unselectCodeLines();
              const activeEl = window.document.querySelector('dt[data-target-cell].code-annotation-active');
              if (activeEl) {
                activeEl.classList.remove('code-annotation-active');
              }
              selectCodeLines(clickedEl);
              clickedEl.classList.add('code-annotation-active');
            } else {
              // Unselect the line
              unselectCodeLines();
              clickedEl.classList.remove('code-annotation-active');
            }
          });
        }
    const findCites = (el) => {
      const parentEl = el.parentElement;
      if (parentEl) {
        const cites = parentEl.dataset.cites;
        if (cites) {
          return {
            el,
            cites: cites.split(' ')
          };
        } else {
          return findCites(el.parentElement)
        }
      } else {
        return undefined;
      }
    };
    var bibliorefs = window.document.querySelectorAll('a[role="doc-biblioref"]');
    for (var i=0; i<bibliorefs.length; i++) {
      const ref = bibliorefs[i];
      const citeInfo = findCites(ref);
      if (citeInfo) {
        tippyHover(citeInfo.el, function() {
          var popup = window.document.createElement('div');
          citeInfo.cites.forEach(function(cite) {
            var citeDiv = window.document.createElement('div');
            citeDiv.classList.add('hanging-indent');
            citeDiv.classList.add('csl-entry');
            var biblioDiv = window.document.getElementById('ref-' + cite);
            if (biblioDiv) {
              citeDiv.innerHTML = biblioDiv.innerHTML;
            }
            popup.appendChild(citeDiv);
          });
          return popup.innerHTML;
        });
      }
    }
  });
  </script>
